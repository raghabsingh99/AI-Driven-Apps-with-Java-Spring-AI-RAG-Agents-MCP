spring.application.name=demo

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7

spring.ai.model.chat=openai
spring.ai.model.embedding=ollama

logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# MySQL database so conversation history survives app restarts.
spring.datasource.url=jdbc:mysql://localhost:3306/chatmemory
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Scientist12!

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Separate datasource dedicated to the persistent vector store (com.course.demo.rag),
# backed by its own MariaDB server (the mariadb-vectorstore Docker container on 3307) -
# independent of the chatmemory datasource above, which is on its own server at 3306.
app.vectorstore.datasource.url=jdbc:mariadb://localhost:3307/vectorstore
app.vectorstore.datasource.driver-class-name=org.mariadb.jdbc.Driver
app.vectorstore.datasource.username=${VECTOR_DB_USERNAME:root}
app.vectorstore.datasource.password=${VECTOR_DB_PASSWORD:Scientist12!}