<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Streaming Fun Facts</title>
<style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.3rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.6; }
    #output {
        white-space: pre-wrap;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 12px;
        min-height: 160px;
        line-height: 1.5;
    }
    #status { color: #666; font-size: 0.9rem; margin-top: 8px; }
</style>
</head>
<body>
<h1>Streaming Fun Facts (Flux)</h1>
<form id="form">
    <input id="topic" type="text" value="Spring AI" placeholder="Topic">
    <button id="submit" type="submit">Stream</button>
</form>
<div id="output"></div>
<div id="status"></div>

<script>
    const form = document.getElementById('form');
    const topicInput = document.getElementById('topic');
    const submitBtn = document.getElementById('submit');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        output.textContent = '';
        status.textContent = 'Connecting...';
        submitBtn.disabled = true;

        try {
            const topic = encodeURIComponent(topicInput.value || 'Spring AI');
            const response = await fetch(`/api/streamed-demo/fun-facts?topic=${topic}`);

            if (!response.ok || !response.body) {
                status.textContent = `Error: HTTP ${response.status}`;
                return;
            }

            status.textContent = 'Streaming...';

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                output.textContent += decoder.decode(value, { stream: true });
            }

            status.textContent = 'Done.';
        } catch (err) {
            status.textContent = `Error: ${err.message}`;
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
